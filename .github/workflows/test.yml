name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # An unparseable workflow fails as a "workflow file issue" without running a step,
  # so a broken refresh.yml would otherwise go unnoticed until the data went stale.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -c "import yaml,glob; [yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml')]"

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tests/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install pytest
      - run: pytest -v --ignore=tests/test_smoke.py
      - run: node --test tests/logic.test.js worker/test/notify.test.js worker/test/push.test.js

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tests/requirements.txt
      - run: pip install -r tests/requirements.txt
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}
      - run: playwright install --with-deps chromium
      - run: pytest tests/test_smoke.py -v
