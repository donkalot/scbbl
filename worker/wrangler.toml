name = "scbbl-notify"
main = "src/index.js"
compatibility_date = "2026-10-01"

[triggers]
crons = ["* * * * *"]

# Create with: wrangler kv namespace create SENT, then paste the id here.
[[kv_namespaces]]
binding = "SENT"
id = "REPLACE_WITH_KV_ID"

[vars]
SITE = "https://donkalot.github.io/scbbl"
NTFY = "https://ntfy.sh"
TOPIC_PREFIX = "scbbl"

# Optional: wrangler secret put NTFY_TOKEN (an ntfy.sh access token, sent as Bearer).
